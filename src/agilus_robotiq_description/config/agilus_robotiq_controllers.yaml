# Combined controllers for Agilus KR 16 R1100-3 + Robotiq 2F-85 in Gazebo Harmonic.
# Loaded by the gz_ros2_control plugin via <parameters>.
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz (matches kuka fake-hardware default for sim)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Arm trajectory controller (MoveIt drives this)
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Gripper: single-DOF position controller on the actuated knuckle.
    # Position commands in gz_ros2_control are velocity setpoints, so the
    # fingers are driven kinematically (the followers track via software
    # mimic). On an object the goal never completes (the controller has no
    # stall detection in position mode); the grasp skill detects the stall and
    # retains a small over-close command, maintaining physical contact force
    # until a release goal preempts it.  This is a friction grip, not a
    # virtual attachment.
    gripper_controller:
      type: position_controllers/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_nonzero_velocity_at_trajectory_end: true

gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    allow_stalling: true
    # Small goal tolerance: with a press preload the fingers must come well
    # past first pad contact before the goal may report "reached". A loose
    # tolerance (0.01) would complete the goal before the fingers even touch
    # the object, so the grasp skill would never see a stall.
    goal_tolerance: 0.003
    max_effort: 50.0
